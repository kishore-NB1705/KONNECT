name: KONNECT CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Basic Python validation
      - name: Validate Python files
        run: |
          python -m compileall .

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t konnect:${{ github.sha }} .

      # 6. Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag konnect:${{ github.sha }} \
            ghcr.io/kishore-nb1705/konnect:${{ github.sha }}

          docker tag konnect:${{ github.sha }} \
            ghcr.io/kishore-nb1705/konnect:latest

      # 8. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/kishore-nb1705/konnect:${{ github.sha }}
          docker push ghcr.io/kishore-nb1705/konnect:latest