name: KONNECT CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run syntax check
        run: |
          python -m compileall .

      - name: Build Docker image
        run: |
          docker build -t konnect:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker images

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag konnect:${{ github.sha }} ghcr.io/kishore-nb1705/konnect:${{ github.sha }}
          docker push ghcr.io/kishore-nb1705/konnect:${{ github.sha }}