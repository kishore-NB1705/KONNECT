name: KONNECT CI/CD

on:

  push:

    branches:
      - main

  workflow_dispatch:


permissions:

  contents: read
  packages: write


jobs:

  build-and-push:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout source code

        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # 3. Install backend dependencies
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. Validate Python
      # ======================================================

      - name: Validate Python files

        run: |

          python -m compileall .


      # ======================================================
      # 5. Login to GHCR
      # ======================================================

      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 6. Build backend image
      # ======================================================

      - name: Build backend image

        run: |

          docker build \
            -t ghcr.io/kishore-nb1705/konnect:${{ github.sha }} \
            .


      # ======================================================
      # 7. Push backend image
      # ======================================================

      - name: Push backend image

        run: |

          docker push \
            ghcr.io/kishore-nb1705/konnect:${{ github.sha }}


      # ======================================================
      # 8. Build frontend image
      # ======================================================

      - name: Build frontend image

        run: |

          docker build \
            -t ghcr.io/kishore-nb1705/konnect-frontend:${{ github.sha }} \
            ./frontend


      # ======================================================
      # 9. Push frontend image
      # ======================================================

      - name: Push frontend image

        run: |

          docker push \
            ghcr.io/kishore-nb1705/konnect-frontend:${{ github.sha }}